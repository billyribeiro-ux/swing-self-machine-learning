[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "swing-rsi-self-learner"
version = "0.1.2"
description = "Research-first daily swing RSI discovery, validation, scanning, and forward testing engine."
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Billy Ribeiro" }]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "pyarrow>=18,<25",
]

[project.optional-dependencies]
research = [
  "optuna>=4.0,<5",
  "matplotlib>=3.9,<4",
]
fallback-data = [
  "yfinance>=0.2.50,<1",
]
parquet = [
  "pyarrow>=18,<25",
]
dashboard = [
  "streamlit>=1.40,<2",
  "watchdog>=4,<7",
]
all = [
  "optuna>=4.0,<5",
  "matplotlib>=3.9,<4",
  "yfinance>=0.2.50,<1",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "pandas-stubs>=2.2,<4",
]

[project.scripts]
swing-rsi = "swing_rsi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swing_rsi", "dashboard"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
packages = ["swing_rsi"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pandas.*", "yaml.*", "yfinance.*", "sklearn.*", "joblib.*"]
ignore_missing_imports = true
